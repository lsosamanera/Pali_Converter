<script>
(() => {
 const root=document.documentElement,themeButton=document.getElementById("theme-toggle"),themeMeta=document.querySelector('meta[name="theme-color"]');
 let savedTheme="dark";
 try{savedTheme=localStorage.getItem("pali-converter-theme")||"dark";}catch{}
 const setTheme=theme=>{
  root.dataset.theme=theme;
  const light=theme==="light";
  themeButton.setAttribute("aria-pressed",String(light));
  themeButton.setAttribute("aria-label",`Switch to ${light?"dark":"light"} mode`);
  themeButton.title=`Switch to ${light?"dark":"light"} mode`;
  themeButton.querySelector("[data-theme-icon]").textContent=light?"☾":"☼";
  themeButton.querySelector("[data-theme-label]").textContent=light?"Dark mode":"Light mode";
  themeMeta.content=light?"#f2f2e8":"#071b16";
  try{localStorage.setItem("pali-converter-theme",theme);}catch{}
  cancelAnimationFrame(frame);lastTime=0;drawParticles(performance.now());
 };
 themeButton.addEventListener("click",()=>setTheme(root.dataset.theme==="light"?"dark":"light"));

 const canvas=document.getElementById("ambient-particles"),ctx=canvas.getContext("2d"),reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
 if(!ctx)return;
 let width=0,height=0,particles=[],frame=0,lastTime=0;
 const resize=()=>{
  cancelAnimationFrame(frame);lastTime=0;
  const ratio=Math.min(window.devicePixelRatio||1,2);
  width=window.innerWidth;height=window.innerHeight;
  canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  const count=Math.max(18,Math.min(52,Math.round(width*height/30000)));
  particles=Array.from({length:count},()=>({x:Math.random()*width,y:Math.random()*height,r:.55+Math.random()*1.4,a:.12+Math.random()*.35,s:.003+Math.random()*.009,p:Math.random()*Math.PI*2}));
  drawParticles(performance.now());
 };
 const drawParticles=now=>{
  if(!ctx||!width||!height)return;
  const delta=lastTime?Math.min(now-lastTime,40):16;lastTime=now;
  ctx.clearRect(0,0,width,height);
  const rgb=getComputedStyle(root).getPropertyValue("--particle-rgb").trim()||"239,205,119";
  for(const dot of particles){
   dot.y-=dot.s*delta;dot.x+=Math.sin(now*.00018+dot.p)*.035;
   if(dot.y< -5){dot.y=height+5;dot.x=Math.random()*width;}
   if(dot.x< -5)dot.x=width+5;else if(dot.x>width+5)dot.x=-5;
   ctx.beginPath();ctx.fillStyle=`rgba(${rgb},${dot.a})`;ctx.shadowColor=`rgba(${rgb},${dot.a*.85})`;ctx.shadowBlur=dot.r*8;ctx.arc(dot.x,dot.y,dot.r,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
  if(!reduceMotion.matches&&!document.hidden)frame=requestAnimationFrame(drawParticles);
 };
 window.addEventListener("resize",resize,{passive:true});
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!reduceMotion.matches){cancelAnimationFrame(frame);frame=requestAnimationFrame(drawParticles);}});
 reduceMotion.addEventListener?.("change",()=>{cancelAnimationFrame(frame);lastTime=0;drawParticles(performance.now());});
 setTheme(savedTheme==="light"?"light":"dark");
 resize();
})();
</script>
<script>
"use strict";
const consonants=[["ṭh","ꩧ"],["ḍh","ꩩ"],["kh","ၶ"],["gh","ꧠ"],["ch","ꧡ"],["jh","ꧢ"],["ṅ","င"],["ñ","ၺ"],["ṭ","ꩦ"],["ḍ","ꩨ"],["ṇ","ꧣ"],["th","ထ"],["dh","ꩪ"],["ph","ၽ"],["bh","ꧤ"],["ḷ","ꩮ"],["k","ၵ"],["g","ၷ"],["c","ၸ"],["j","ꩡ"],["t","တ"],["d","ၻ"],["n","ၼ"],["p","ပ"],["b","ၿ"],["m","မ"],["y","ယ"],["r","ရ"],["l","လ"],["w","ဝ"],["v","ဝ"],["s","သ"],["h","ႁ"]];
const independent={"aṃ":"ဢံ","iṃ":"ဢိံ","uṃ":"ဢုံ","a":"ဢ","ā":"ဢႃ","i":"ဢိ","ī":"ဢီ","u":"ဢု","ū":"ဢူ","e":"ဢေ","ē":"ဢေ","o":"ဢေႃ"};
const signs={"a":"","ā":"ႃ","i":"ိ","ī":"ီ","u":"ု","ū":"ူ","e":"ေ","ē":"ေ","o":"ေႃ"};
const vowelTokens=["ā","ī","ū","ē","a","i","u","e","o"];
const references={"tena":"တေၼ","samayena":"သမယေၼ","buddho":"ၿုၻ်ꩪေႃ","bhagavā":"ꧤၷဝႃ","verañjāyaṃ":"ဝေရၺ်ၸႃယံ","viharati":"ဝိႁရတိ","naḷerupuccimandamūle":"ၼꩮေရုပုၸ်ၸိမၼ်ၻမူလေ","mahatā":"မႁတႃ","bhikkhusaṅghena":"ꧤိၵ်ၶုသံꧠေၼ","saddhiṃ":"သၻ်ꩪိံ","pañcamattēhi":"ပၺ်ၸမတ်တေႁိ","bhikkhusatehi":"ꧤိၵ်ၶုသတေႁိ"};
const romanSample="Tena samayena buddho bhagavā verañjāyaṃ viharati naḷerupuccimandamūle mahatā bhikkhusaṅghena saddhiṃ pañcamattēhi bhikkhusatehi.";
const shanSample="တေၼ သမယေၼ ၿုၻ်ꩪေႃ ꧤၷဝႃ ဝေရၺ်ၸႃယံ ဝိႁရတိ ၼꩮေရုပုၸ်ၸိမၼ်ၻမူလေ မႁတႃ ꧤိၵ်ၶုသံꧠေၼ သၻ်ꩪိံ ပၺ်ၸမတ်တေႁိ ꧤိၵ်ၶုသတေႁိ။";
function normalize(s){return s.normalize("NFC").toLowerCase().replace(/[’‘]/g,"'");}
function matchConsonant(s,i){for(const [roman,out] of consonants)if(s.startsWith(roman,i))return{roman,out};return null;}
function readMedials(s,i){let out="",p=i;while(p<s.length){const x=s[p];if(x==="r")out+="ြ";else if(x==="y")out+="ျ";else if(x==="v"||x==="w")out+="ွ";else break;p++;}return{out,index:p};}
function matchVowel(s,i){return vowelTokens.find(v=>s.startsWith(v,i))||null;}
function consonantVowelSign(s,i,v){
 const afterVowel=i+v.length,first=s[afterVowel];
 // r/y/v/w are medials, not the start of a consonant cluster.
 if(first==="r"||first==="y"||first==="v"||first==="w")return signs[v];
 const firstConsonant=matchConsonant(s,afterVowel);
 if(!firstConsonant)return signs[v];
 const secondConsonant=matchConsonant(s,afterVowel+firstConsonant.roman.length);
 if(!secondConsonant)return signs[v];
 if(v==="ā")return "ၢ";
 if(v==="o")return "ေၢ";
 const firstRoot=firstConsonant.roman.endsWith("h")?firstConsonant.roman.slice(0,-1):firstConsonant.roman;
 const secondRoot=secondConsonant.roman.endsWith("h")?secondConsonant.roman.slice(0,-1):secondConsonant.roman;
 if((v==="e"||v==="ē")&&firstRoot===secondRoot)return "ဵ";
 return signs[v];
}
function convertWord(raw){
 const s=normalize(raw);if(references[s])return references[s];let out="",i=0;
 while(i<s.length){
  const independentMatch=["aṃ","iṃ","uṃ","ā","ī","ū","ē","a","i","u","e","o"].find(v=>s.startsWith(v,i));
  const c=matchConsonant(s,i);
  if(!c&&independentMatch){out+=independent[independentMatch];i+=independentMatch.length;continue;}
  if(c){
   const after=i+c.roman.length;
   // Medials are tested before gemination and generic cluster handling.
   const medials=readMedials(s,after);
   if(medials.out){out+=c.out+medials.out;i=medials.index;const v=matchVowel(s,i);if(v){out+=consonantVowelSign(s,i,v);i+=v.length;}continue;}
   const next=matchConsonant(s,after);
   if(next){
    const afterPair=after+next.roman.length,tail=readMedials(s,afterPair);
    out+=c.out+"်"+next.out+tail.out;i=tail.index;const v=matchVowel(s,i);if(v){out+=consonantVowelSign(s,i,v);i+=v.length;}continue;
   }
   out+=c.out;i=after;const v=matchVowel(s,i);if(v){out+=consonantVowelSign(s,i,v);i+=v.length;}continue;
  }
  if(s.startsWith("ṃ",i)){out+="ံ";i++;continue;}
  const ch=raw[i]??s[i];out+=ch==="."?"။":ch===","?"၊":ch;i++;
 }
 return out;
}
function convertRomanText(text){return text.replace(/[A-Za-zāīūēṅñṭḍṇḷṃĀĪŪĒṄÑṬḌṆḶ]+|[.,]/g,t=>t==="."?"။":t===","?"၊":convertWord(t));}
// Burmese Pāli uses the Burmese letter forms from the Library of Congress Pāli table.
// Conjuncts use Myanmar virama (္); r/y/v medials use ြ/ျ/ွ.
const burmeseConsonants=[["ss","ဿ"],["mh","မှ"],["ṭh","ဌ"],["ḍh","ဎ"],["kh","ခ"],["gh","ဃ"],["ch","ဆ"],["jh","ဈ"],["ṅ","င"],["ññ","ည"],["ñ","ဉ"],["ṭ","ဋ"],["ḍ","ဍ"],["ṇ","ဏ"],["th","ထ"],["dh","ဓ"],["ph","ဖ"],["bh","ဘ"],["ḷ","ဠ"],["k","က"],["g","ဂ"],["c","စ"],["j","ဇ"],["t","တ"],["d","ဒ"],["n","န"],["p","ပ"],["b","ဗ"],["m","မ"],["y","ယ"],["r","ရ"],["l","လ"],["v","ဝ"],["w","ဝ"],["s","သ"],["h","ဟ"]];
const burmeseIndependent={"aṃ":"အံ","iṃ":"ဣံ","uṃ":"ဥံ","ā":"အာ","ī":"ဤ","ū":"ဦ","a":"အ","i":"ဣ","u":"ဥ","e":"ဧ","ē":"ဧ","o":"ဪ"};
const burmeseSigns={"a":"","ā":"ာ","i":"ိ","ī":"ီ","u":"ု","ū":"ူ","e":"ေ","ē":"ေ","o":"ော"};
const burmeseTallAaConsonants=new Set(["ခ","ဂ","င","ဒ","ဓ","ပ","ဝ"]);

function convertRomanToBurmeseWord(raw){

function convertRomanToBurmeseText(text){return text.replace(/[A-Za-zāīūēṅñṭḍṇḷṃĀĪŪĒṄÑṬḌṆḶ]+|[.,]/g,t=>t==="."?"။":t===","?"၊":convertRomanToBurmeseWord(t));}
const burmeseReverseConsonants=burmeseConsonants.filter(([roman])=>roman!=="w").map(([roman,script])=>({roman,script})).sort((a,b)=>b.script.length-a.script.length);

function convertBurmeseWord(raw){

  const c=matchBurmeseScriptConsonant(s,i);

   out+=c.roman;i+=c.script.length;
   while(i<s.length){const m=s[i];if(m==="ြ"){out+="r";i++;}else if(m==="ျ"){out+="y";i++;}else if(m==="ွ"){out+="v";i++;}else if(m==="ှ"){out+="h";i++;}else break;}
