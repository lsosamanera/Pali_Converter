<script>

const romanSample="Tena samayena buddho bhagavā verañjāyaṃ viharati naḷerupuccimandamūle mahatā bhikkhusaṅghena saddhiṃ pañcamattēhi bhikkhusatehi.";
const shanSample="တေၼ သမယေၼ ၿုၻ်ꩪေႃ ꧤၷဝႃ ဝေရၺ်ၸႃယံ ဝိႁရတိ ၼꩮေရုပုၸ်ၸိမၼ်ၻမူလေ မႁတႃ ꧤိၵ်ၶုသံꧠေၼ သၻ်ꩪိံ ပၺ်ၸမတ်တေႁိ ꧤိၵ်ၶုသတေႁိ။";
function normalize(s){return s.normalize("NFC").toLowerCase().replace(/[’‘]/g,"'");}
function matchConsonant(s,i){for(const [roman,out] of consonants)if(s.startsWith(roman,i))return{roman,out};return null;}

function matchVowel(s,i){return vowelTokens.find(v=>s.startsWith(v,i))||null;}
function consonantVowelSign(s,i,v){
 const afterVowel=i+v.length,first=s[afterVowel];
 // r/y/v/w are medials, not the start of a consonant cluster.

 const firstRoot=firstConsonant.roman.endsWith("h")?firstConsonant.roman.slice(0,-1):firstConsonant.roman;

}
function convertWord(raw){
 const s=normalize(raw);if(references[s])return references[s];let out="",i=0;
 while(i<s.length){
  const independentMatch=["aṃ","iṃ","uṃ","ā","ī","ū","ē","a","i","u","e","o"].find(v=>s.startsWith(v,i));
  const c=matchConsonant(s,i);
  if(!c&&independentMatch){out+=independent[independentMatch];i+=independentMatch.length;continue;}
  if(c){
   const after=i+c.roman.length;
   // Medials are tested before gemination and generic cluster handling.
   const medials=readMedials(s,after);
   if(medials.out){out+=c.out+medials.out;i=medials.index;const v=matchVowel(s,i);if(v){out+=consonantVowelSign(s,i,v);i+=v.length;}continue;}

    out+=c.out+"်"+next.out+tail.out;i=tail.index;const v=matchVowel(s,i);if(v){out+=consonantVowelSign(s,i,v);i+=v.length;}continue;
   }
   out+=c.out;i=after;const v=matchVowel(s,i);if(v){out+=consonantVowelSign(s,i,v);i+=v.length;}continue;
  }
  if(s.startsWith("ṃ",i)){out+="ံ";i++;continue;}

}
function convertRomanText(text){return text.replace(/[A-Za-zāīūēṅñṭḍṇḷṃĀĪŪĒṄÑṬḌṆḶ]+|[.,]/g,t=>t==="."?"။":t===","?"၊":convertWord(t));}
// Burmese Pāli uses the Burmese letter forms from the Library of Congress Pāli table.
// Conjuncts use Myanmar virama (္); r/y/v medials use ြ/ျ/ွ.
const burmeseConsonants=[["ss","ဿ"],["mh","မှ"],["ṭh","ဌ"],["ḍh","ဎ"],["kh","ခ"],["gh","ဃ"],["ch","ဆ"],["jh","ဈ"],["ṅ","င"],["ññ","ည"],["ñ","ဉ"],["ṭ","ဋ"],["ḍ","ဍ"],["ṇ","ဏ"],["th","ထ"],["dh","ဓ"],["ph","ဖ"],["bh","ဘ"],["ḷ","ဠ"],["k","က"],["g","ဂ"],["c","စ"],["j","ဇ"],["t","တ"],["d","ဒ"],["n","န"],["p","ပ"],["b","ဗ"],["m","မ"],["y","ယ"],["r","ရ"],["l","လ"],["v","ဝ"],["w","ဝ"],["s","သ"],["h","ဟ"]];
const burmeseIndependent={"aṃ":"အံ","iṃ":"ဣံ","uṃ":"ဥံ","ā":"အာ","ī":"ဤ","ū":"ဦ","a":"အ","i":"ဣ","u":"ဥ","e":"ဧ","ē":"ဧ","o":"ဪ"};
const burmeseSigns={"a":"","ā":"ာ","i":"ိ","ī":"ီ","u":"ု","ū":"ူ","e":"ေ","ē":"ေ","o":"ော"};
const burmeseTallAaConsonants=new Set(["ခ","ဂ","င","ဒ","ဓ","ပ","ဝ"]);
const burmeseTallAaOConsonants=new Set(["ခ","ဂ","င","ဒ","ဓ","ပ","ဝ"]);
const burmeseReferences={"buddho":"ဗုဒ္ဓေါ","saṃghena":"သံဃေန"};
const burmeseVowels=["ā","ī","ū","ē","a","i","u","e","o"];
function matchBurmeseConsonant(s,i){for(const [roman,out] of burmeseConsonants)if(s.startsWith(roman,i))return{roman,out};return null;}
function convertRomanToBurmeseWord(raw){
 const s=normalize(raw);if(burmeseReferences[s])return burmeseReferences[s];let out="",i=0;
 while(i<s.length){
  const independent=Object.keys(burmeseIndependent).sort((a,b)=>b.length-a.length).find(v=>s.startsWith(v,i));
  const c=matchBurmeseConsonant(s,i);

   const after=i+c.roman.length,medials=readMedials(s,after),next=matchBurmeseConsonant(s,medials.index);

   else i=medials.index;

  }

}
function convertRomanToBurmeseText(text){return text.replace(/[A-Za-zāīūēṅñṭḍṇḷṃĀĪŪĒṄÑṬḌṆḶ]+|[.,]/g,t=>t==="."?"။":t===","?"၊":convertRomanToBurmeseWord(t));}
const burmeseReverseConsonants=burmeseConsonants.filter(([roman])=>roman!=="w").map(([roman,script])=>({roman,script})).sort((a,b)=>b.script.length-a.script.length);
const burmeseIndependentReverse=[["အာ","ā"],["အါ","ā"],["ဣံ","iṃ"],["ဥံ","uṃ"],["အံ","aṃ"],["ဤ","ī"],["ဦ","ū"],["ဪ","o"],["ဩ","o"],["ဧ","e"],["ဨ","e"],["ဣ","i"],["ဥ","u"],["အ","a"]];
const burmeseReverseVowels=[["ော","o"],["ေါ","o"],["ို","o"],["ါ","ā"],["ာ","ā"],["ိ","i"],["ီ","ī"],["ု","u"],["ူ","ū"],["ေ","e"]];
function matchBurmeseScriptConsonant(s,i){for(const c of burmeseReverseConsonants)if(s.startsWith(c.script,i))return c;return null;}
function convertBurmeseWord(raw){
 const s=raw.normalize("NFC");let out="",i=0;
 while(i<s.length){
  const independent=burmeseIndependentReverse.find(([script])=>s.startsWith(script,i));
  if(independent){out+=independent[1];i+=independent[0].length;continue;}
  const c=matchBurmeseScriptConsonant(s,i);
  if(c){
   out+=c.roman;i+=c.script.length;
   while(i<s.length){const m=s[i];if(m==="ြ"){out+="r";i++;}else if(m==="ျ"){out+="y";i++;}else if(m==="ွ"){out+="v";i++;}else if(m==="ှ"){out+="h";i++;}else break;}

   if(s[i]==="္"||s[i]==="်"){i++;continue;}

   if(vowel){out+=vowel[1];i+=vowel[0].length;}else out+="a";
   if(s.startsWith("ံ",i)){out+="ṃ";i++;}
   continue;
  }
  if(s.startsWith("ံ",i)){out+="ṃ";i++;continue;}
  const ch=s[i];

}
function convertBurmeseText(text){
 const roman=text.replace(/[\u1000-\u109F\uA9E0-\uA9FF]+|[၊။]/g,t=>t==="။"?".":t==="၊"?",":convertBurmeseWord(t));

const shanReferences=Object.fromEntries(Object.entries(references).map(([roman,shan])=>[shan,roman]));
const reverseConsonants=consonants.filter(([roman])=>roman!=="w").map(([roman,script])=>({roman,script})).sort((a,b)=>b.script.length-a.script.length);

function matchShanConsonant(s,i){for(const c of reverseConsonants)if(s.startsWith(c.script,i))return c;return null;}
function matchShanVowel(s,i){for(const [script,roman] of reverseVowels)if(s.startsWith(script,i))return{script,roman};return null;}

 const s=raw.normalize("NFC");if(shanReferences[s])return shanReferences[s];let out="",i=0;

  const independent=independentReverse.find(([script])=>s.startsWith(script,i));

  const c=matchShanConsonant(s,i);
  if(c){
   out+=c.roman;i+=c.script.length;
   while(i<s.length){const m=s[i];if(m==="ြ"){out+="r";i++;}else if(m==="ျ"){out+="y";i++;}else if(m==="ွ"){out+="v";i++;}else break;}
   if(s.startsWith("်",i)){i++;continue;}
   const vowel=matchShanVowel(s,i);
   if(vowel){out+=vowel.roman;i+=vowel.script.length;}else out+="a";
   if(s.startsWith("ံ",i)){out+="ṃ";i++;}
   continue;
  }
  if(s.startsWith("ံ",i)){out+="ṃ";i++;continue;}
  const ch=s[i];out+=ch==="။"?".":ch==="၊"?",":ch;i++;
 }
 return out;
}
function convertShanText(text){
 const roman=text.replace(/[\u1000-\u109F\uA980-\uA9FF\uAA60-\uAA7F]+|[၊။]/g,t=>t==="။"?".":t==="၊"?",":convertShanWord(t));

}
function convertText(text){const [source,target]=direction.value.split("-to-");if(source==="roman"&&target==="shan")return convertRomanText(text);if(source==="roman"&&target==="burmese")return convertRomanToBurmeseText(text);if(source==="shan"&&target==="roman")return convertShanText(text);if(source==="burmese"&&target==="roman")return convertBurmeseText(text);if(source==="shan"&&target==="burmese")return convertRomanToBurmeseText(convertShanText(text));if(source==="burmese"&&target==="shan")return convertRomanText(convertBurmeseText(text));return text;}
const input=document.getElementById("input"),output=document.getElementById("output"),direction=document.getElementById("direction");
const inputCount=document.getElementById("input-count"),outputCount=document.getElementById("output-count"),sfxButton=document.getElementById("sfx");
let soundEnabled=true,audioContext=null;
function playTone(freq,duration=0.09,delay=0,volume=0.045){if(!soundEnabled)return;try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();const start=audioContext.currentTime+delay,osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type="sine";osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(0.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+0.012);gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start(start);osc.stop(start+duration+0.01);}catch(_){}}
function syncCounts(){inputCount.textContent=input.value.length+" "+(input.value.length===1?"character":"characters");outputCount.textContent=output.value.length+" "+(output.value.length===1?"character":"characters");}
input.addEventListener("input",syncCounts);output.addEventListener("input",syncCounts);
function updateDirectionLabels(){const [sourceKey,targetKey]=direction.value.split("-to-"),names={roman:"Roman Pāli",shan:"Shan Pāli",burmese:"Burmese Pāli"},source=names[sourceKey],target=names[targetKey];document.getElementById("input-label").textContent=source+" input";document.getElementById("output-label").textContent=target+" result";input.placeholder="Type or paste "+source+" here…";output.placeholder="Your "+target+" result will appear here…";input.setAttribute("aria-label",source+" input");output.setAttribute("aria-label",target+" result");}
direction.addEventListener("change",()=>{output.value="";updateDirectionLabels();syncCounts();});

document.getElementById("convert").addEventListener("click",()=>{output.value=convertText(input.value);syncCounts();playTone(660,.12);playTone(880,.17,.11);});
document.getElementById("sample").addEventListener("click",()=>{const source=direction.value.split("-to-")[0];input.value=source==="roman"?romanSample:source==="shan"?shanSample:convertRomanToBurmeseText(romanSample);output.value=convertText(input.value);syncCounts();playTone(620,.08);});
document.getElementById("clear").addEventListener("click",()=>{input.value="";output.value="";syncCounts();playTone(520,.11);playTone(390,.14,.1);});
document.getElementById("copy").addEventListener("click",async()=>{if(!output.value)return;try{await navigator.clipboard.writeText(output.value);playTone(740,.08);}catch(_){output.focus();output.select();}});
document.getElementById("paste").addEventListener("click",async()=>{try{const text=await navigator.clipboard.readText();const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.value=input.value.slice(0,start)+text+input.value.slice(end);const caret=start+text.length;input.focus();input.setSelectionRange(caret,caret);syncCounts();playTone(620,.08);}catch(_){input.focus();}});
sfxButton.addEventListener("click",()=>{soundEnabled=!soundEnabled;sfxButton.textContent=soundEnabled?"🔊 SFX On":"🔇 SFX Off";sfxButton.setAttribute("aria-pressed",String(soundEnabled));sfxButton.title=soundEnabled?"Turn sound effects off":"Turn sound effects on";if(soundEnabled)playTone(720,.08);});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")document.getElementById("convert").click();});
updateDirectionLabels();syncCounts();
</script></body></html>
